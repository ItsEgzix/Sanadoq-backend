# @claude in an issue, a PR comment or a review: Claude answers, or does the
# work on a branch and opens a PR. Only people with write access can trigger
# it (the action checks), which matters on this public repo.
#
# Needs: the Claude GitHub App installed on this repo, and the repository
# secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Until the secret
# exists, the job skips itself instead of failing.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on a PR
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip until CLAUDE_CODE_OAUTH_TOKEN is set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Claude is not configured for this repo yet (no CLAUDE_CODE_OAUTH_TOKEN secret)."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npx prisma generate
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --append-system-prompt "Follow AGENTS.md. Load the backend-style and sanadoq-backend skills before writing or reviewing code. Never run prisma migrate dev, migrate reset or db push. This repository is public: never write real names, account numbers or workbook figures into it."
            --allowedTools "Skill,Read,Edit,Write,Glob,Grep,Bash(npm run lint),Bash(npx eslint:*),Bash(npx tsc --noEmit),Bash(npm test:*),Bash(npx jest:*),Bash(npm run build),Bash(npx prisma generate),Bash(npx prisma validate),Bash(npx prisma format),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
