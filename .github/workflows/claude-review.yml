# Claude reviews every pull request once when it opens (or leaves draft),
# against this repo's own skills. Ask for another pass with "@claude review".
#
# Needs the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret (see
# claude.yml). PRs from forks and Dependabot get no secrets, so they skip.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip until CLAUDE_CODE_OAUTH_TOKEN is set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Claude review is not configured for this repo yet (no CLAUDE_CODE_OAUTH_TOKEN secret)."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to the Sanadoq API (a charity fund's books).
            First read AGENTS.md and load the backend-style and sanadoq-backend
            skills; for books logic also read the README's "How the books work".

            Report only what a careful senior reviewer would block or ask about:
            1. Correctness of the books: money as Decimal and fixed-scale strings,
               never summed across programs; program→program payments booked once;
               arrears / ratio / terms rules reused from their one home, not re-derived.
            2. Migrations: hand-written SQL with its comment block, schema.prisma
               matching, backfill before drop, destructive steps guarded, and safe
               to run while the code now in production keeps serving (expand →
               deploy → contract). Vercel deploys before the migration is approved.
            3. Access: every route declares @Public/@AnyAuthenticated/@RequirePermission;
               fund data is never @Public; nothing returns password hashes or tokens.
            4. Every new success or error code present in both en and ar events.json.
            5. Relative imports only (no 'src/' or 'generated/' aliases).
            6. Validation at the edge with Zod; every list bounded; no N+1 or
               sequential reads that could run in Promise.all.
            7. Tests for new service methods (happy path, refusal, guarded edges),
               asserting errorCode and that refused writes did not happen.
            8. API shape changes: is the PR labelled api-contract, with a frontend issue?
            9. This repo is public: no real names, account numbers or workbook
               figures in code, tests, fixtures or comments.

            Skip formatting and lint (CI enforces them). Use inline comments for
            specific lines, then one short summary comment: blocking issues first,
            then suggestions, then what you could not verify. If there is nothing
            to block, say so plainly.
          claude_args: |
            --allowedTools "Skill,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
